<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelForge · Revelado de fotos concurrente</title>
  <meta name="description" content="Editor de fotos en Vanilla JS con Dedicated Web Workers y Service Worker.">
  <meta name="theme-color" content="#232524">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>PixelForge</h1>
    <ul class="badges" aria-label="Estado de la aplicación">
      <li id="badge-net" class="badge">En línea</li>
      <li id="badge-sw" class="badge">Service Worker: …</li>
      <li id="badge-fps" class="badge">– FPS</li>
      <li id="badge-long" class="badge">Long Tasks: 0</li>
      <li><button id="btn-install" type="button" hidden>Instalar app</button></li>
    </ul>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Mesa de revelado">
      <div class="canvas-wrap">
        <canvas id="canvas" width="960" height="540" aria-label="Vista de la fotografía"></canvas>
        <p id="empty-hint">Abre una foto o genera una imagen de prueba de 12 MP para empezar.</p>
      </div>

      <div class="progress-row">
        <progress id="progress" max="100" value="0"></progress>
        <span id="progress-label" role="status">Inactivo</span>
        <button id="btn-cancel" type="button" disabled>Cancelar</button>
      </div>

      <div class="liveness">
        <div class="track" aria-hidden="true"><span id="dot" class="dot"></span></div>
        <input id="live-input" type="text" placeholder="Escribe aquí mientras se procesa" aria-label="Campo de prueba de fluidez">
        <button id="btn-tap" type="button">Clic de prueba</button>
        <output id="live-count">0 clics</output>
      </div>
    </section>

    <aside class="panel" aria-label="Controles">
      <fieldset>
        <legend>Fotografía</legend>
        <input id="file" type="file" accept="image/*" aria-label="Elegir imagen">
        <button id="btn-sample" type="button">Generar imagen de prueba (12 MP)</button>
      </fieldset>

      <fieldset>
        <legend>Ajustes</legend>
        <label>Brillo <output id="o-brightness">0</output><input id="brightness" type="range" min="-100" max="100" value="0"></label>
        <label>Contraste <output id="o-contrast">0</output><input id="contrast" type="range" min="-100" max="100" value="0"></label>
        <label>Saturación <output id="o-saturation">0</output><input id="saturation" type="range" min="-100" max="100" value="0"></label>
        <label>Desenfoque (radio) <output id="o-blur">0</output><input id="blur" type="range" min="0" max="30" value="0"></label>
        <label class="check"><input id="grayscale" type="checkbox"> Blanco y negro</label>
        <label class="check"><input id="sepia" type="checkbox"> Sepia</label>
      </fieldset>

      <fieldset>
        <legend>Ejecución</legend>
        <label>Dónde se procesa
          <select id="mode">
            <option value="worker">Web Worker (recomendado)</option>
            <option value="main">Hilo principal (solo para comparar)</option>
          </select>
        </label>
        <label class="check"><input id="notify" type="checkbox"> Avisarme al terminar si estoy en otra pestaña</label>
        <div class="row">
          <button id="btn-apply" type="button" class="primary" disabled>Aplicar filtros</button>
          <button id="btn-reset" type="button" disabled>Restablecer</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Exportar</legend>
        <label>Formato
          <select id="format">
            <option value="image/webp">WebP</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/png">PNG</option>
          </select>
        </label>
        <div class="row">
          <button id="btn-export" type="button" disabled>Descargar</button>
          <button id="btn-recover" type="button">Recuperar último resultado</button>
        </div>
      </fieldset>

      <dl class="metrics" aria-label="Métricas del último procesamiento">
        <dt>Modo</dt><dd id="m-mode">–</dd>
        <dt>Resolución</dt><dd id="m-res">–</dd>
        <dt>Tiempo</dt><dd id="m-time">–</dd>
        <dt>FPS mínimo</dt><dd id="m-fps">–</dd>
        <dt>Long Tasks</dt><dd id="m-long">–</dd>
      </dl>
    </aside>
  </main>

  <ol id="log" aria-label="Bitácora" aria-live="polite"></ol>

  <script type="module" src="js/main.js"></script>
</body>
</html>
